plugins {
    id 'java'
    id 'application'
    id 'com.google.osdetector' version '1.7.3'
    // https://github.com/ben-manes/gradle-versions-plugin
    // task: dependencyUpdates
    id 'com.github.ben-manes.versions' version '0.53.0'
}

def appName='GPXEditor'
group='tf.GPXEditor'
version='5.10'
description = 'GPXEditor - JavaFX GPX file editor'

def fxPlatform = osdetector.os == 'osx' ? 'mac' : osdetector.os == 'windows' ? 'win' : osdetector.os
def javafxVersion = '25.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal() {
        // breaking change in gradle 6.*: doesn't find jar files automatically when no pom.xml is present...
        // https://discuss.gradle.org/t/how-to-fetch-maven-artifact-without-pom-file-in-gradle-6-0/33836
        metadataSources {
            mavenPom()
            artifact()
        }
        // only our own helper library and the self-built gpx-parser 1.14 come from the local repo - everything else from remote repos
        content {
            includeGroup 'tf.JavaHelper'
            includeGroup 'me.himanshusoni.gpxparser'
        }
    }
    mavenCentral()
}

dependencies {
    // JavaFX explicit dependencies
    implementation "org.openjfx:javafx-base:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-graphics:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-controls:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-fxml:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-swing:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-web:$javafxVersion:$fxPlatform"
    implementation "org.openjfx:javafx-media:$javafxVersion:$fxPlatform"

    // TFE, 20191209: our own helper library
    implementation 'tf.JavaHelper:JavaHelper:1.17'

    implementation 'commons-cli:commons-cli:1.11.0'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'me.himanshusoni.gpxparser:gpx-parser:1.14'
    implementation 'org.controlsfx:controlsfx:11.2.3'

    // TFE, 20210310: newer versions not working since GlyphsDude not found
    // https://bitbucket.org/Jerady/fontawesomefx/issues/72/glyphsdude-and-package
    implementation 'de.jensd:fontawesomefx:8.9'

    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.2')
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'

    // TFE, 20260109: this can work with a path that contains arrays...
    implementation 'com.jayway.jsonpath:json-path:3.0.0'

    implementation 'de.grundid.opendatalab:geojson-jackson:3.0'
    implementation 'org.jfxtras:jfxtras-controls:17-r1'
    implementation 'org.jfxtras:jfxtras-labs:9.0-r1'
    implementation 'org.jfxtras:jmetro:11.6.16'

    implementation 'uk.com.robust-it:cloning:1.9.12'

    implementation 'org.im4java:im4java:1.4.0'

    // TFE, 20211222: Savitzky-Golay-Filter for track smoothing
    implementation 'io.github.ruozhuochen:savitzky-golay-filter:1.0.1'

    // TFE, 20220115: 3rd alternative: fxyz3d
    implementation 'org.fxyz3d:fxyz3d:0.6.0'

    // TFE, 20220201: faster list
    implementation 'org.magicwerk.brownies:brownies-collections:0.9.24'

    // sun data
    implementation 'net.e175.klaus:solarpositioning:2.0.12'

    // timezone provider
    implementation 'us.dustinj.timezonemap:timezonemap:4.5'
    constraints {
        // timezonemap brings outdated versions (commons-compress 1.20 has known vulnerabilities)
        implementation 'org.apache.commons:commons-compress:1.28.0'
        implementation 'com.github.luben:zstd-jni:1.5.7-7'
    }

    // TFE, 20220320: change to charts based on canvas for performance
    // latest version compatible with javafx 15 is for 11
    // 21.0.23ff gives Illegal character in path at index 128
    implementation 'eu.hansolo.fx:charts:21.0.21'

    testImplementation platform('org.junit:junit-bom:5.13.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // TFE, 20221231: build a test suite for all non-UI tests
    testImplementation 'org.junit.platform:junit-platform-suite-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // TFE, 20210216: capture System.err() easily
    testImplementation 'com.github.stefanbirkner:system-lambda:1.2.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

// JavaFX needs to be on the module path at runtime - only the platform specific jars
// the whole classpath / lib dir would fail on duplicate automatic modules (e.g. jfxtras-all)
def javafxJars = configurations.runtimeClasspath.filter { it.name.startsWith('javafx-') && !(it.name ==~ /javafx-[a-z]+-[\d.]+\.jar/) }

abstract class ModulePathArgumentProvider implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getModulePath()

    @Override
    Iterable<String> asArguments() {
        return ['--module-path', modulePath.asPath]
    }
}

// see https://github.com/kelemen/netbeans-gradle-project/issues/403 on how to extend gradle tasks
def javafxArgs = [ '--add-modules', 'javafx.controls,javafx.graphics,javafx.base,javafx.fxml,javafx.web,javafx.swing,javafx.media',
                // various exports needed at run time - see https://stackoverflow.com/a/52142071
                '--add-exports', 'javafx.graphics/com.sun.javafx.util=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.reflect=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.beans=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.logging=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.runtime=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.collections=ALL-UNNAMED',
                '--add-exports', 'javafx.base/com.sun.javafx.event=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.prism=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.sg.prism=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.scene=ALL-UNNAMED',
                '--add-exports', 'javafx.media/com.sun.media.jfxmedia=ALL-UNNAMED',
                '--add-exports', 'javafx.media/com.sun.media.jfxmedia.events=ALL-UNNAMED',
                '--add-exports', 'javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED',
                '--add-exports', 'javafx.controls/com.sun.javafx.scene.control.behavior=ALL-UNNAMED',
                '--add-exports', 'javafx.controls/com.sun.javafx.scene.control.inputmap=ALL-UNNAMED',
                '--add-exports', 'javafx.controls/com.sun.javafx.charts=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.scene.traversal=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED',
                '--add-exports', 'javafx.graphics/com.sun.javafx.scene.input=ALL-UNNAMED',
                '--add-opens', 'javafx.graphics/javafx.scene.layout=ALL-UNNAMED',
                // TFE, 20200803: workaround for "WARNING: Illegal reflective access by com.rits.cloning.Cloner"
                // https://github.com/x-stream/xstream/issues/101#issuecomment-667734663
                '--add-opens', 'java.base/java.util=ALL-UNNAMED',
                // TFE, 20230616: needed for cloning metadata
                '--add-opens', 'java.base/java.time=ALL-UNNAMED',
                '--add-opens', 'java.base/java.time.zone=ALL-UNNAMED',
                '--add-opens', 'java.base/sun.util.calendar=ALL-UNNAMED',
                // TFE, 20251224: Updates for Java25 and Gradle 9
                '--enable-native-access', 'javafx.graphics',
                '--enable-native-access', 'javafx.web',
                '--enable-native-access', 'ALL-UNNAMED',
    ]
def jvmFlags = javafxArgs + ['-Xss80M', '-Xmx4096M', '-Dprism.maxvram=1G']

// TFE, 20251224: Updates for Java25 and Gradle 9
application {
    mainClass = 'tf.gpx.edit.main.GPXEditorManager'
    // used by "run" and by the generated start scripts in build/install/GPXEditor/bin
    applicationDefaultJvmArgs = jvmFlags + ['-enableassertions']
}

// start scripts need the javafx jars on the module path - inject it with the script's own APP_HOME
startScripts {
    def ownJar = tasks.named('jar').flatMap { it.archiveFileName }
    def fxJarNames = javafxJars.elements.map { files -> files.collect { it.asFile.name } }
    doLast {
        def windowsModulePath = fxJarNames.get().collect { "%APP_HOME%\\lib\\${it}" }.join(';')
        def unixModulePath = fxJarNames.get().collect { '$APP_HOME/lib/' + it }.join(':')
        windowsScript.text = windowsScript.text.replace('set DEFAULT_JVM_OPTS=', "set DEFAULT_JVM_OPTS=\"--module-path=${windowsModulePath}\" ")
        // list of all jars is too long for the windows command line - use wildcard but keep our own jar first
        windowsScript.text = windowsScript.text.replaceFirst(/(?m)^set CLASSPATH=.*$/, java.util.regex.Matcher.quoteReplacement("set CLASSPATH=%APP_HOME%\\lib\\${ownJar.get()};%APP_HOME%\\lib\\*"))
        unixScript.text = unixScript.text.replace('\nexec "$JAVACMD" "$@"', "\nexec \"\$JAVACMD\" --module-path=\"${unixModulePath}\" \"\$@\"")
    }
}

// extend Netbeans Gradle "Run" task
tasks.named('run', JavaExec) {
    jvmArgumentProviders.add(objects.newInstance(ModulePathArgumentProvider).tap { modulePath.from(javafxJars) })
    enableAssertions = true
//    args = ["-mapCenter", "46.660578140310854 11.15942716598511", "-gpxFiles", "D:/Clouds/ownCloud/Shared/Gemeinsame Dokumente/Urlaub/Gardasee_2025/Variante Brenta/Gardasee_2025_5Tage_2.gpx"]
    args = ["-mapCenter", "46.660578140310854 11.15942716598511"]
//    args = ["-mergeFiles", "P:/Pictures/Raw/GPX/*.gpx"]
}

tasks.named('test', Test) {
//    exclude '**/*'
    jvmArgumentProviders.add(objects.newInstance(ModulePathArgumentProvider).tap { modulePath.from(javafxJars) })
    jvmArgs(jvmFlags)
    enableAssertions = true

    // https://stackoverflow.com/a/35467005
    testLogging.showStandardStreams = true
    useJUnitPlatform()
}

// TFE, 20261026: Windows exe via jpackage - own java runtime incl. javafx, no installed java required
//   gradlew jpackageImage     -> build/jpackage/image/GPXEditor/GPXEditor.exe (portable folder)
//   gradlew jpackageInstaller -> build/jpackage/installer/GPXEditor-<version>.exe (needs WiX 3, found via %WIX%)
// javafx is linked into the runtime from the javafx jmods - when updating javafxVersion also update the sha256
// see https://gluonhq.com/products/javafx/
def javafxJmodsUrl = "https://download2.gluonhq.com/openjfx/${javafxVersion}/openjfx-${javafxVersion}_windows-x64_bin-jmods.zip"
def javafxJmodsSha256 = '8f52d62b386bcf33a7c6077da052717446dd4238f2f92298bb0788cdcef9b4ed'
// outside of build dir to survive "clean"
def javafxJmodsDir = new File(gradle.gradleUserHomeDir, "caches/javafx-jmods/${javafxVersion}")
// java modules used by GPXEditor and its libraries (jdeps) + locale data, charsets & crypto that jdeps can't detect
def runtimeModules = ['java.base', 'java.desktop', 'java.logging', 'java.management', 'java.naming', 'java.net.http',
                      'java.prefs', 'java.scripting', 'java.sql', 'java.xml', 'jdk.accessibility', 'jdk.charsets',
                      'jdk.crypto.ec', 'jdk.crypto.mscapi', 'jdk.jsobject', 'jdk.localedata', 'jdk.unsupported', 'jdk.zipfs',
                      'javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.fxml', 'javafx.swing', 'javafx.web', 'javafx.media']
def appVersion = version
def appDescription = description
def appVendor = 'Thomas Feuster'
def jpackageExe = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        .map { it.metadata.installationPath.file('bin/jpackage.exe').asFile.absolutePath }
// jpackage wants one token per --java-options: "--add-exports", "x" -> "--add-exports=x"
def jpackageJavaOptions = []
(jvmFlags + ['-enableassertions']).each { arg ->
    if (!arg.startsWith('-') && jpackageJavaOptions) {
        jpackageJavaOptions[-1] = jpackageJavaOptions[-1] + '=' + arg
    } else {
        jpackageJavaOptions << arg
    }
}

abstract class DownloadJmodsTask extends DefaultTask {
    @Input abstract Property<String> getUrl()
    @Input abstract Property<String> getSha256()
    @OutputDirectory abstract DirectoryProperty getDestinationDir()
    @Inject abstract FileSystemOperations getFs()
    @Inject abstract ArchiveOperations getArchives()

    @TaskAction
    void download() {
        def zip = new File(temporaryDir, 'jmods.zip')
        new URI(url.get()).toURL().withInputStream { input -> zip.withOutputStream { it << input } }
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(zip.bytes).encodeHex().toString()
        if (actual != sha256.get()) {
            throw new GradleException("SHA-256 mismatch for ${url.get()}: expected ${sha256.get()}, got ${actual}")
        }
        fs.sync {
            from(archives.zipTree(zip)) {
                include '**/*.jmod'
                eachFile { it.path = it.name }
            }
            into destinationDir
            includeEmptyDirs = false
        }
        zip.delete()
    }
}

abstract class JPackageTask extends DefaultTask {
    @Input abstract Property<String> getJpackage()
    @Input abstract ListProperty<String> getArguments()
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE) abstract ConfigurableFileCollection getSources()
    @Input @Optional abstract Property<String> getWixHome()
    @OutputDirectory abstract DirectoryProperty getDestinationDir()
    @Inject abstract ExecOperations getExecOps()
    @Inject abstract FileSystemOperations getFs()

    @TaskAction
    void pack() {
        // jpackage refuses to overwrite existing output
        fs.delete { delete destinationDir }
        execOps.exec {
            executable jpackage.get()
            args arguments.get()
            args '--dest', destinationDir.get().asFile.absolutePath
            if (wixHome.present) {
                environment 'PATH', "${wixHome.get()}\\bin;${System.getenv('PATH')}"
            }
        }
    }
}

def downloadJavafxJmods = tasks.register('downloadJavafxJmods', DownloadJmodsTask) {
    url = javafxJmodsUrl
    sha256 = javafxJmodsSha256
    destinationDir = javafxJmodsDir
}

// application jars without javafx - javafx comes with the runtime
def jpackageInputDir = layout.buildDirectory.dir('jpackage/input')
def jpackageInput = tasks.register('jpackageInput', Sync) {
    from(tasks.named('jar'))
    from(configurations.runtimeClasspath) {
        exclude 'javafx-*', 'jdk-jsobject-*'
    }
    into jpackageInputDir
}

def jpackageImageDir = layout.buildDirectory.dir('jpackage/image')
def jpackageImage = tasks.register('jpackageImage', JPackageTask) {
    group = 'distribution'
    description = 'Creates a portable GPXEditor folder with GPXEditor.exe and its own java runtime.'
    sources.from(jpackageInput, downloadJavafxJmods)
    jpackage = jpackageExe
    destinationDir = jpackageImageDir
    def mainJar = tasks.named('jar').flatMap { it.archiveFileName }
    arguments.addAll(['--type', 'app-image',
                      '--name', appName,
                      '--app-version', appVersion,
                      '--vendor', appVendor,
                      '--description', appDescription,
                      '--icon', file('src/main/resources/GPXEditorManager.ico').absolutePath,
                      '--input', jpackageInputDir.get().asFile.absolutePath,
                      '--main-class', 'tf.gpx.edit.main.GPXEditorManager',
                      '--module-path', javafxJmodsDir.absolutePath,
                      '--add-modules', runtimeModules.join(','),
                      '--jlink-options', '--strip-debug --no-header-files --no-man-pages --strip-native-commands'])
    arguments.addAll(mainJar.map { ['--main-jar', it] })
    arguments.addAll(jpackageJavaOptions.collectMany { ['--java-options', it] })
}

tasks.register('jpackageInstaller', JPackageTask) {
    group = 'distribution'
    description = 'Creates a Windows installer GPXEditor-<version>.exe from the jpackageImage.'
    sources.from(jpackageImage)
    jpackage = jpackageExe
    destinationDir = layout.buildDirectory.dir('jpackage/installer')
    wixHome = providers.environmentVariable('WIX')
    arguments.addAll(['--type', 'exe',
                      '--app-image', jpackageImageDir.get().dir(appName).asFile.absolutePath,
                      '--name', appName,
                      '--app-version', appVersion,
                      '--vendor', appVendor,
                      '--description', appDescription,
                      '--win-menu',
                      '--win-shortcut',
                      '--win-dir-chooser',
                      '--win-per-user-install',
                      // fixed id so that a new version replaces the installed one
                      '--win-upgrade-uuid', 'fecd95c1-b9f1-4e0c-9075-721a5f95a9d8'])
}

jar {
    manifest {
        attributes(
            'Built-By'       : System.properties['user.name'],
            'Build-Timestamp': new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
            'Created-By'     : "Gradle ${gradle.gradleVersion}",
            'Build-Jdk'      : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
            'Build-OS'       : "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}",
            'App-Name'       : appName,
            'App-Version'    : archiveVersion,
            'App-URL'        : "https://github.com/ThomasDaheim/GPXEditor"
        )
    }
}

sourceSets {
    main {
        resources {
            // only use minified files
            exclude {
                FileTreeElement elem -> ((elem.name.contains('.js') || elem.name.contains('.css')) && !elem.name.contains('.min.'))
            }
        }
    }
}

tasks.named('build') {
    finalizedBy 'installDist'
}
